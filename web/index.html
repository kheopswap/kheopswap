<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kheopswap</title>
    <meta
      name="description"
      content="Decentralized exchange app for Polkadot"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="theme-color" content="#000000" />
    <style type="text/css">
      html{background:#000}html[data-mode=light]{background:#fff}
    </style>
    <script>
      (() => {
        let mode = "dark";
        try {
          if (localStorage.getItem("kheopswap-color-mode") === "light") mode = "light";
        } catch {}
        document.documentElement.dataset.mode = mode;
        if (mode === "light")
          document.querySelector('meta[name="theme-color"]').content = "#ffffff";
      })();
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kheopswap.xyz/" />
    <meta property="og:title" content="Kheopswap" />
    <meta
      property="og:description"
      content="Decentralized exchange app for Polkadot"
    />
    <meta
      property="og:image"
      content="https://kheopswap.xyz/android-chrome-512x512.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://kheopswap.xyz/" />
    <meta property="twitter:title" content="Kheopswap" />
    <meta
      property="twitter:description"
      content="Decentralized exchange app for Polkadot"
    />
    <meta
      property="twitter:image"
      content="https://kheopswap.xyz/android-chrome-512x512.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
