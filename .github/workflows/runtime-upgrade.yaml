name: Runtime Upgrade

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: runtime-upgrade
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  runtime-upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      # descriptors aren't needed to fetch metadata, so skip the postinstall codegen
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Update metadata
        run: pnpm papi update --skip-codegen

      - name: Open an issue per upgraded chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_titles=$(gh issue list --state open --limit 500 --json title --jq '.[].title')
          for chain in $(git diff --name-only -- .papi/scale | xargs -r -n1 basename -s .scale); do
            title="Runtime upgrade on $chain"
            if grep -qxF "$title" <<< "$open_titles"; then
              echo "already open: $title"
            else
              gh issue create --title "$title" --body "The $chain runtime changed since the committed metadata. Run \`pnpm papi update $chain\` and fix what breaks."
            fi
          done
