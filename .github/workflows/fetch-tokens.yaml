name: Fetch Tokens

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: fetch-tokens
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # see pull_request.yaml — package.json's `engines` range would let CI drift across majors
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      # see pull_request.yaml — papi's postinstall codegen dominates the install step otherwise
      - name: Restore papi descriptors
        uses: actions/cache@v6
        with:
          path: .papi/descriptors
          key: papi-${{ runner.os }}-${{ hashFiles('.papi/polkadot-api.json', '.papi/scale/**', 'pnpm-lock.yaml') }}
          restore-keys: |
            papi-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch tokens
        run: pnpm fetch-tokens
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Hard cap: 80 * 4 runs/day * ~30 days = 9,600 max/month
          COINGECKO_BUDGET_PER_RUN: "80"

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet -- 'web/src/registry/tokens/generated/tokens.*.json' 'web/scripts/erc20-cache.json' 'web/scripts/.last-warnings-hash' 'web/public/img/tokens/coingecko/*.webp' || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- web/src/registry/tokens/generated/ web/scripts/erc20-cache.json web/scripts/.last-warnings-hash web/public/img/tokens/coingecko/
          git diff --cached --quiet || (git commit -m "chore: update token snapshots" && git push)
