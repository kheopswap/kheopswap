packages:
  - web

allowBuilds:
  "@reown/appkit": false
  esbuild: false
  simple-git-hooks: true

# don't install NPM dependencies which were published less than 3 days ago
# provides some buffer time for the package maintainer / wider community to detect and publicise malicious package versions
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # first-party: published by this repo's owner, so the buffer against a compromised third-party publisher does not apply
  - "@kheopskit/*"

overrides:
  # GHSA-ggr8-5vv4-36mx (high), patched >=8.0.0. write-package, used only by the papi CLI that
  # polkadot-api ships, still declares ^7.1.0.
  "deepmerge-ts@<8.0.0": "^8.0.0"
  # GHSA-mrhx-c7xc-m3w5 (high), patched >=4.6.6, no 3.x backport. @reown/appkit-wallet pins 3.22.4 and
  # @coinbase/cdp-sdk (via @reown/appkit) declares ^3.25.76. Their zod schemas are tree-shaken out of the
  # bundle, but under zod 4 appkit-wallet's frame schema rejects messages it accepted under zod 3: revisit
  # before enabling AppKit's email or social login.
  "zod@<4.6.6": "^4.6.6"
  # NOTE: elliptic GHSA-848j-6mx2-7j84 (low, dev-only crypto-browserify polyfill) covers every version
  # (<=6.6.1, still the latest on 2026-11-19) and has no patched release.
